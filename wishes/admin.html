<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>管理信件</title>
<link rel="stylesheet" href="style.css">
<style>
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; }
  .tabs button.on { background: var(--accent); color: var(--accent-ink); }
  .item { margin: 0 0 12px; }
  .item .meta { font-size: 13px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
  .item .text { white-space: pre-wrap; word-break: break-word; margin: 6px 0 10px; }
  .item .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); }
  details { margin: 0 0 16px; }
  summary { cursor: pointer; color: var(--accent); margin: 0 0 12px; }
</style>
</head>
<body>
<main>
  <h1>管理信件</h1>
  <p class="sub">这个页面的地址别发给别人</p>

  <form class="card" id="login">
    <div class="field">
      <label for="pass">管理口令</label>
      <input type="password" id="pass" autocomplete="current-password">
    </div>
    <button type="submit">进去</button>
    <p class="msg err" id="loginMsg"></p>
  </form>

  <section id="panel" class="hidden">
    <details class="card">
      <summary>写你自己那一封（会排第一）</summary>
      <form id="own">
        <div class="field"><label for="ownName">署名</label><input type="text" id="ownName" maxlength="20"></div>
        <div class="field"><label for="ownBody">正文</label><textarea id="ownBody"></textarea></div>
        <button type="submit">放进去</button>
        <p class="msg" id="ownMsg"></p>
      </form>
    </details>

    <div class="card" style="margin:0 0 16px">
      <label class="check" style="color:var(--ink);font-size:15px">
        <input type="checkbox" id="auto"> 新写的直接显示（关掉就是你先审过才显示）
      </label>
      <p class="msg" id="autoMsg"></p>
    </div>

    <div class="row" style="margin:0 0 16px">
      <span class="count" id="summary"></span>
      <span style="display:flex;gap:8px">
        <button class="ghost" id="exportJson">导出 JSON</button>
        <button class="ghost" id="exportHtml">导出静态页</button>
      </span>
    </div>

    <div class="tabs" id="tabs">
      <button class="ghost on" data-f="all">全部</button>
      <button class="ghost" data-f="approved">显示中</button>
      <button class="ghost" data-f="pending">待审</button>
      <button class="ghost" data-f="rejected">藏起来的</button>
    </div>
    <div id="list"></div>
  </section>
</main>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
(function () {
  const C = window.WISH_CONFIG, api = window.WishAPI;
  const $ = (id) => document.getElementById(id);
  let pass = "", all = [], filter = "all";
  const LABEL = { pending: "待审", approved: "显示中", rejected: "藏起来了" };

  try { pass = sessionStorage.getItem("wish_pass") || ""; } catch (e) {}


  async function refresh() {
    all = await api.rpc("admin_list", { p_pass: pass });
    const n = (s) => all.filter((w) => w.status === s).length;
    $("summary").textContent = `共 ${all.length} 封 · 显示中 ${n("approved")} · 待审 ${n("pending")}`;
    render();
  }

  function render() {
    const box = $("list");
    box.textContent = "";
    const rows = all.filter((w) => filter === "all" || w.status === filter);
    if (!rows.length) {
      const p = document.createElement("p"); p.className = "empty"; p.textContent = "这里没有信"; box.appendChild(p); return;
    }
    rows.forEach((w) => {
      const card = document.createElement("div"); card.className = "card item";
      const meta = document.createElement("div"); meta.className = "meta";
      const who = document.createElement("b"); who.textContent = w.nickname || "没署名";
      const when = document.createElement("span"); when.textContent = api.fmtTime(w.created_at);
      const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = (w.pinned ? "置顶 · " : "") + LABEL[w.status];
      meta.append(who, when, tag);
      const t = document.createElement("div"); t.className = "text"; t.textContent = w.body;
      let art = null;
      if (w.strokes && w.strokes.length) {
        art = document.createElement("canvas"); art.className = "letter-art"; art.style.maxWidth = "220px";
      }
      const acts = document.createElement("div"); acts.className = "acts";
      const mk = (label, fn) => { const b = document.createElement("button"); b.className = "ghost"; b.textContent = label; b.onclick = fn; acts.appendChild(b); };
      if (w.status !== "approved") mk("显示", () => act("admin_set_status", { p_id: w.id, p_status: "approved" }));
      if (w.status !== "rejected") mk("藏起来", () => act("admin_set_status", { p_id: w.id, p_status: "rejected" }));
      if (w.status !== "pending")  mk("放回待审", () => act("admin_set_status", { p_id: w.id, p_status: "pending" }));
      // 删除要点两次，防手滑
      const del = document.createElement("button"); del.type = "button"; del.className = "ghost"; del.textContent = "删掉";
      del.onclick = () => {
        if (del.dataset.armed) return act("admin_delete", { p_id: w.id });
        del.dataset.armed = "1"; del.textContent = "再点一次就删了";
        setTimeout(() => { delete del.dataset.armed; del.textContent = "删掉"; }, 3000);
      };
      acts.appendChild(del);
      card.append(meta);
      if (art) card.append(art);
      card.append(t, acts);
      box.appendChild(card);
      if (art) api.paint(art, w.strokes);
    });
  }

  async function act(fn, args) {
    try { await api.rpc(fn, Object.assign({ p_pass: pass }, args)); await refresh(); }
    catch (e) { alert(e.message); }
  }

  async function enter() {
    try {
      await refresh();
      try { sessionStorage.setItem("wish_pass", pass); } catch (e) {}
      $("login").classList.add("hidden");
      $("panel").classList.remove("hidden");
      const s = await api.rpc("wish_status");
      $("auto").checked = s.auto_approve;
    } catch (e) {
      $("loginMsg").textContent = e.message;
      try { sessionStorage.removeItem("wish_pass"); } catch (_) {}
    }
  }

  $("login").addEventListener("submit", (e) => { e.preventDefault(); pass = $("pass").value; enter(); });
  if (pass) enter();

  $("tabs").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    filter = b.dataset.f;
    [...$("tabs").children].forEach((x) => x.classList.toggle("on", x === b));
    render();
  });

  $("own").addEventListener("submit", async (e) => {
    e.preventDefault();
    const m = $("ownMsg");
    try {
      await api.rpc("admin_add_own", { p_pass: pass, p_nickname: $("ownName").value, p_question: "", p_body: $("ownBody").value });
      $("ownBody").value = ""; m.className = "msg ok"; m.textContent = "放进去了，排第一"; await refresh();
    } catch (err) { m.className = "msg err"; m.textContent = err.message; }
  });

  $("auto").addEventListener("change", async (e) => {
    const m = $("autoMsg"), on = e.target.checked;
    try {
      await api.rpc("admin_set_auto_approve", { p_pass: pass, p_on: on });
      m.className = "msg ok"; m.textContent = on ? "新写的会直接显示" : "新写的要你点了「显示」才出现";
    } catch (err) { e.target.checked = !on; m.className = "msg err"; m.textContent = err.message; }
  });

  function download(name, text, type) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  const stamp = () => new Date().toISOString().slice(0, 10);

  $("exportJson").onclick = () =>
    download(`wishes-${stamp()}.json`, JSON.stringify(all.map(({ ip_hash, ...w }) => w), null, 2), "application/json");

  // 导出一份不依赖数据库的静态页：只含显示中的信，样式和主图都塞进同一个文件，单独打开也完整
  $("exportHtml").onclick = async () => {
    const esc = api.esc;
    const css = await fetch("style.css").then((r) => r.text()).catch(() => "");
    let hero = "";
    if (C.HERO_IMAGE) {
      try {
        const blob = await fetch(C.HERO_IMAGE).then((r) => r.blob());
        hero = await new Promise((ok) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(blob); });
      } catch (e) {}
    }
    const rows = all.filter((w) => w.status === "approved")
      .sort((a, b) => (b.pinned - a.pinned) || (new Date(b.created_at) - new Date(a.created_at)));
    const html = `<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(C.TITLE)}</title>
<style>${css}</style></head><body><main>
${C.BADGE ? `<span class="badge">${esc(C.BADGE)}</span>` : ""}
<h1>${esc(C.TITLE)}</h1><p class="sub">${esc(C.SUBTITLE)}</p><div class="flourish">✦</div>
${hero ? `<figure class="hero"><img src="${hero}" alt=""></figure>` : ""}
<h2 class="section-title">大家写的</h2><p class="section-sub">一共 ${rows.length} 封</p>
<div class="letters">${rows.map((w, i) => api.letterHTML(w, i, "", w.strokes && w.strokes.length ? api.artDataURL(w.strokes, 600) : "")).join("")}</div>
<p class="foot">✦</p></main></body></html>`;
    download(`wishes-${stamp()}.html`, html, "text/html");
  };
})();
</script>
</body>
</html>
