<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f0e8">
<title>一百天</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <span class="badge hidden" id="badge"></span>
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  <div class="flourish">✦</div>
  <figure class="hero hidden" id="hero"><img alt=""></figure>

  <form class="card" id="form" autocomplete="off">
    <p class="form-title">留一句给<span class="recipient"></span></p>
    <div class="field">
      <label>挑一个来答</label>
      <div class="chips" id="chips" role="radiogroup"></div>
    </div>
    <div class="field">
      <textarea id="body" placeholder="一两句就好" aria-label="正文"></textarea>
      <div class="row"><span></span><span class="count" id="count"></span></div>
    </div>
    <div class="field">
      <label for="name">你的名字</label>
      <input type="text" id="name" maxlength="20" placeholder="她认得出你的那个称呼">
      <label class="check" style="margin-top:10px"><input type="checkbox" id="anon"> 不署名</label>
    </div>
    <button type="submit" class="wide" id="send">写好了</button>
    <p class="msg" id="msg" role="status"></p>
  </form>

  <h2 class="section-title" id="listTitle">大家写的</h2>
  <p class="section-sub" id="status">正在翻…</p>
  <div class="letters" id="letters"></div>

  <p class="foot">✦</p>
</main>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
(function () {
  const C = window.WISH_CONFIG, api = window.WishAPI;
  const $ = (id) => document.getElementById(id);

  document.title = C.TITLE;
  $("title").textContent = C.TITLE;
  $("subtitle").textContent = C.SUBTITLE;
  if (C.BADGE) { $("badge").textContent = C.BADGE; $("badge").classList.remove("hidden"); }
  document.querySelectorAll(".recipient").forEach((el) => (el.textContent = C.RECIPIENT));
  if (C.HERO_IMAGE) { $("hero").querySelector("img").src = C.HERO_IMAGE; $("hero").classList.remove("hidden"); }

  // 问题做成能点的小标签
  [...C.QUESTIONS, C.FREE_QUESTION].forEach((q, i) => {
    const l = document.createElement("label");
    l.className = "chip";
    const r = document.createElement("input");
    r.type = "radio"; r.name = "q"; r.value = q; r.checked = i === 0;
    const s = document.createElement("span");
    s.textContent = q;
    l.append(r, s);
    $("chips").appendChild(l);
  });
  const question = () => (document.querySelector('input[name=q]:checked') || {}).value || C.FREE_QUESTION;

  const body = $("body"), count = $("count");
  const len = (s) => [...s.trim()].length;
  function updateCount() {
    const n = len(body.value);
    count.textContent = n + " / " + C.MAX_LEN;
    count.classList.toggle("over", n > C.MAX_LEN);
  }
  body.addEventListener("input", updateCount);
  updateCount();

  $("anon").addEventListener("change", (e) => { $("name").disabled = e.target.checked; });

  async function load(highlightFirst) {
    try {
      const [s, list] = await Promise.all([api.rpc("wish_status"), api.rpc("public_wishes")]);
      $("status").textContent = list.length ? "一共 " + s.count + " 封，新的在前面" : "还没人写，你来第一个";
      // 置顶那封之后的第一封就是最新的
      const newestIdx = list.findIndex((w) => !w.pinned);
      $("letters").innerHTML = list
        .map((w, i) => api.letterHTML(w, i, highlightFirst && i === newestIdx ? "new" : ""))
        .join("");
    } catch (e) {
      $("status").textContent = "暂时没连上，刷新试试";
    }
  }
  load(false);

  // 只有数据库确认收到了才算写进去；成功后从数据库重新读一遍
  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("msg"), send = $("send");
    msg.className = "msg";
    msg.textContent = "";
    const text = body.value.trim();
    if (!text) { msg.className = "msg err"; msg.textContent = "还没写字呢"; return; }
    if (len(text) > C.MAX_LEN) { msg.className = "msg err"; msg.textContent = "字有点多，挑最想说的那句"; return; }

    send.disabled = true;
    send.textContent = "正在存…";
    try {
      const r = await api.rpc("submit_wish", {
        p_nickname: $("anon").checked ? "" : $("name").value,
        p_question: question(),
        p_body: text,
      });
      body.value = "";
      updateCount();
      msg.className = "msg ok";
      if (r.status === "approved") {
        msg.textContent = "留下了 · " + api.fmtTime(r.created_at);
        await load(true);
        $("listTitle").scrollIntoView({ behavior: "smooth", block: "start" });
      } else {
        msg.textContent = "收到了 · " + api.fmtTime(r.created_at) + "，过一遍之后会出现在下面";
      }
    } catch (err) {
      msg.className = "msg err";
      msg.textContent = err.message; // 写的字留在框里，不会丢
    } finally {
      send.disabled = false;
      send.textContent = "写好了";
    }
  });
})();
</script>
</body>
</html>
