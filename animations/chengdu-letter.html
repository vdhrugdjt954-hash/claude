<title>成都来信</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+XiaoWei&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #17120f;
    --panel: #221a16;
    --line: #3a2d26;
    --ink: #f3e9df;
    --muted: #b3a296;
    --clay: #d97757;
    --gold: #e8c872;
    --display: "ZCOOL XiaoWei", "Songti SC", "STSong", serif;
    --body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  html, body { background: var(--ground); color: var(--ink); }
  body { font-family: var(--body); padding: 0 16px; }
  .wrap { max-width: 980px; margin: 0 auto; padding-block: 28px 40px; display: grid; gap: 18px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 5vw, 40px); margin: 0; letter-spacing: 0.04em; text-wrap: balance; }
  h1 span { color: var(--clay); }
  .meta { color: var(--muted); font-size: 13px; letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }

  .stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  .sub { position: absolute; left: 50%; bottom: 5%; transform: translateX(-50%); width: min(88%, 760px); text-align: center; pointer-events: none; }
  .sub p { display: inline; margin: 0; font-size: clamp(13px, 2.3vw, 21px); line-height: 1.7; font-weight: 500; color: #fff7ee; background: rgba(20, 12, 8, .66); padding: 3px 10px; box-decoration-break: clone; -webkit-box-decoration-break: clone; border-radius: 4px; }
  .sub b { color: var(--gold); font-weight: 700; margin-right: .4em; }
  .cover { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(12, 8, 6, .35); border: 0; cursor: pointer; color: var(--ink); font: inherit; }
  .cover[hidden] { display: none; }
  .cover span { display: grid; gap: 8px; justify-items: center; }
  .cover i { width: 76px; height: 76px; border-radius: 50%; background: var(--clay); display: grid; place-items: center; box-shadow: 0 0 0 8px rgba(217,119,87,.25); transition: transform .2s; }
  .cover i::after { content: ""; border-left: 24px solid #fff; border-top: 15px solid transparent; border-bottom: 15px solid transparent; margin-left: 6px; }
  .cover:hover i, .cover:focus-visible i { transform: scale(1.06); }
  .cover em { font-style: normal; font-size: 14px; letter-spacing: .12em; background: rgba(20,12,8,.6); padding: 2px 10px; border-radius: 3px; }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  button.ctl { font: inherit; font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  button.ctl[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
  button.ctl:hover { border-color: var(--clay); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .spacer { flex: 1; }

  ol.chapters { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  @media (max-width: 560px) { ol.chapters { grid-template-columns: repeat(2, 1fr); } }
  ol.chapters button { width: 100%; text-align: left; font: inherit; font-size: 13px; color: var(--muted); background: transparent; border: 0; border-top: 2px solid var(--line); padding: 8px 2px 2px; cursor: pointer; display: grid; gap: 2px; }
  ol.chapters button small { font-size: 11px; letter-spacing: .1em; font-variant-numeric: tabular-nums; }
  ol.chapters button.on { color: var(--ink); border-top-color: var(--clay); }
  ol.chapters button.done { border-top-color: #7a4a38; }
  .note { color: var(--muted); font-size: 12px; line-height: 1.7; margin: 0; }
</style>

<div class="wrap">
  <header>
    <h1>成都来信 <span>·</span> 给雨墨</h1>
    <div class="meta">林帆 · 2026.09.28 · 约 1 分 30 秒</div>
  </header>

  <div class="stage">
    <canvas id="cv" width="1280" height="720" aria-label="像素动画：林帆和雨墨的日常"></canvas>
    <div class="sub" aria-live="polite"><p id="sub"><b>林帆</b>点一下开始，声音开着看。</p></div>
    <button class="cover" id="cover" type="button" aria-label="播放动画"><span><i></i><em>点一下，开声音</em></span></button>
  </div>

  <div class="bar">
    <button class="ctl" id="playBtn" type="button">播放</button>
    <button class="ctl" id="restartBtn" type="button">从头</button>
    <span class="spacer"></span>
    <button class="ctl" id="voiceBtn" type="button" aria-pressed="true">配音</button>
    <button class="ctl" id="musicBtn" type="button" aria-pressed="true">背景音乐</button>
  </div>

  <ol class="chapters" id="chapters"></ol>
  <p class="note">配音用的是浏览器自带的中文语音，每台手机声音不一样；没有中文语音的话只显示字幕。背景音乐是现场合成的，没有外部文件。</p>
</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const G = cv.getContext('2d');
  const off = document.createElement('canvas');
  off.width = 320; off.height = 180;
  const g = off.getContext('2d');
  const S = 4; // lowres → main scale

  // ---------- palette ----------
  const C = {
    clawd: '#D97757', shade: '#B8603F', eye: '#1b1310',
    gold: '#EDCB6E', goldDk: '#C9A447', black: '#231d22', purple: '#A07FD6', purpleDk: '#7E5DB5',
  };
  const HAIR = { yumo: 'gold', linfan: 'black', muguang: 'purple' };

  // ---------- pixel helpers ----------
  const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };
  const hash = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };

  const BODY = [
    '..XXXXXXXX..',
    '..XXXXXXXX..',
    '..XXEXXEXX..',
    'XXXXEXXEXXXX',
    'XXXXXXXXXXXX',
    '..XXXXXXXX..',
  ];
  // Claude's little pixel critter. x,y = top-left, s = pixel size.
  function clawd(x, y, s, o = {}) {
    const t = o.t || 0;
    const blink = (t + (o.seed || 0)) % 3.7 < 0.14 || o.sleepy && (t % 2.2) < 0.5;
    BODY.forEach((row, ry) => {
      for (let rx = 0; rx < 12; rx++) {
        const ch = row[rx];
        if (ch === '.') continue;
        let col = ry === 5 ? C.shade : C.clawd;
        if (ch === 'E') col = blink ? (ry === 3 ? C.eye : C.clawd) : C.eye;
        R(x + rx * s, y + ry * s, s, s, col);
      }
    });
    if (o.legs !== false) {
      const step = o.walk ? Math.floor(t * 6) % 2 : 0;
      [2, 4, 7, 9].forEach((lx, i) => {
        const lift = o.walk && (i % 2 === step) ? 1 : 0;
        R(x + lx * s, y + 6 * s, s, (2 - lift) * s, C.shade);
      });
    }
    if (o.hair) hair(x, y, s, o.hair);
  }
  function hair(x, y, s, kind) {
    const map = { gold: [C.gold, C.goldDk], black: [C.black, '#3a3038'], purple: [C.purple, C.purpleDk] }[kind];
    const [c, d] = map;
    for (let i = 2; i < 10; i++) R(x + i * s, y - s, s, s, c);
    R(x + 3 * s, y - 2 * s, 5 * s, s, c);
    if (kind === 'gold') { // short bob with a fringe
      R(x + 2 * s, y, s, 2 * s, c); R(x + 9 * s, y, s, 2 * s, c);
      R(x + 3 * s, y, 2 * s, s, d); R(x + 6 * s, y, s, s, d);
    } else { // long hair falling down both sides
      const len = kind === 'purple' ? 7 : 6;
      R(x + 1 * s, y, s, len * s, c); R(x + 10 * s, y, s, len * s, c);
      R(x + 2 * s, y, s, s, c); R(x + 9 * s, y, s, s, c);
      R(x + 4 * s, y, 3 * s, s, d);
    }
  }
  function box(x, y, w, h) {
    R(x, y, w, h, '#C99B62'); R(x, y, w, 2, '#E0B77E'); R(x + w / 2 - 1, y, 2, h, '#8E6A3E'); R(x, y + h - 2, w, 2, '#A67C48');
  }
  function sky(top, bot) {
    const gr = g.createLinearGradient(0, 0, 0, 180); gr.addColorStop(0, top); gr.addColorStop(1, bot);
    g.fillStyle = gr; g.fillRect(0, 0, 320, 180);
  }
  function stars(t, n, maxY) {
    for (let i = 0; i < n; i++) {
      const on = Math.sin(t * 2 + i * 1.7) > -0.3;
      if (on) R(hash(i) * 320, hash(i + 50) * maxY, 1, 1, i % 5 ? '#e9e3ff' : '#fff4c2');
    }
  }
  // text on the hi-res canvas, coords in lowres units
  function T(str, x, y, o = {}) {
    G.save();
    G.font = `${o.w || 500} ${(o.size || 7) * S}px ${o.display ? '"ZCOOL XiaoWei", serif' : '"Noto Sans SC", sans-serif'}`;
    G.textAlign = o.align || 'center'; G.textBaseline = 'middle';
    G.globalAlpha = o.a == null ? 1 : Math.max(0, Math.min(1, o.a));
    if (o.bg) {
      const m = G.measureText(str).width, p = 3 * S, hh = (o.size || 7) * S * 1.5;
      const bx = o.align === 'left' ? x * S - p : x * S - m / 2 - p;
      G.fillStyle = o.bg; G.beginPath(); G.roundRect(bx, y * S - hh / 2, m + p * 2, hh, 2 * S); G.fill();
    }
    G.fillStyle = o.c || '#fff'; G.fillText(str, x * S, y * S);
    G.restore();
  }
  const ease = v => v < 0 ? 0 : v > 1 ? 1 : v * v * (3 - 2 * v);

  // ---------- scenes ----------
  const scenes = [
    {
      name: '下午三点', place: '成都 · 小店', dur: 8,
      say: '雨墨，今天怎么样？店里刚忙完，我坐下来歇会儿。',
      sub: '雨墨，今天怎么样？店里刚忙完，我坐下来歇会儿。',
      draw(t) {
        R(0, 0, 320, 180, '#4a3228');
        // window onto the street
        const gr = g.createLinearGradient(0, 18, 0, 98); gr.addColorStop(0, '#f6d29b'); gr.addColorStop(1, '#e79a6a');
        g.fillStyle = gr; g.fillRect(186, 18, 116, 80);
        [[190, 60, 14], [206, 44, 12], [220, 66, 20], [242, 38, 10], [254, 56, 18], [274, 48, 14], [288, 62, 12]].forEach(([bx, by, bw]) => R(bx, by, bw, 98 - by, '#9b6450'));
        for (let i = 0; i < 6; i++) R(196 + i * 18 + ((t * 4 + i * 7) % 3), 90, 2, 8, '#6f8a4a'); // bamboo pots
        R(186, 18, 116, 3, '#2a1c16'); R(186, 95, 116, 3, '#2a1c16'); R(186, 18, 3, 80, '#2a1c16'); R(299, 18, 3, 80, '#2a1c16'); R(243, 18, 2, 80, '#2a1c16');
        // shelf with cups
        [44, 70].forEach(sy => { R(18, sy, 100, 3, '#2e2019'); for (let i = 0; i < 6; i++) R(24 + i * 16, sy - 7, 8, 7, i % 2 ? '#efe6da' : '#c9d6cf'); });
        // lamps
        [70, 150].forEach((lx, i) => {
          R(lx, 0, 1, 20 + i * 4, '#1d1411');
          g.fillStyle = 'rgba(255,214,150,.13)'; g.beginPath(); g.arc(lx, 30 + i * 4, 26 + Math.sin(t * 2 + i) * 1.5, 0, 7); g.fill();
          R(lx - 5, 20 + i * 4, 11, 5, '#e8b25e');
        });
        R(0, 150, 320, 30, '#2e2019');
        clawd(112, 90 + (Math.floor(t * 2) % 2), 3, { t, hair: HAIR.linfan, legs: false });
        // counter
        R(70, 118, 200, 34, '#7a5236'); R(70, 116, 200, 4, '#a2714a');
        for (let i = 0; i < 8; i++) R(78 + i * 25, 124, 1, 26, '#6a4630');
        // espresso machine
        R(214, 92, 34, 24, '#c7c2bd'); R(214, 92, 34, 4, '#e3dfdb'); R(224, 104, 12, 4, '#3a3432'); R(237, 97, 5, 3, '#d97757');
        // cup + steam
        R(166, 108, 10, 8, '#f4ede4'); R(176, 110, 3, 4, '#f4ede4'); R(167, 108, 8, 2, '#6b3f25');
        for (let i = 0; i < 3; i++) {
          const p = (t * 0.7 + i / 3) % 1;
          g.globalAlpha = 1 - p; R(168 + i * 3 + Math.sin(p * 6 + i) * 2, 104 - p * 18, 1, 2, '#fff'); g.globalAlpha = 1;
        }
      },
      overlay(t) { T('FAN’S', 244, 30, { size: 5, c: '#5a3527', w: 700, a: .5 }); },
    },
    {
      name: '慢一个小时', place: '成都 → Salaya', dur: 8.5,
      say: '你那边慢一个小时。我算着呢，这会儿你应该刚下课。',
      sub: '你那边慢一个小时。我算着呢，这会儿你应该刚下课。',
      draw(t) {
        R(0, 0, 320, 180, '#15203a');
        for (let x = 8; x < 320; x += 16) for (let y = 8; y < 180; y += 16) R(x, y, 1, 1, '#26345a');
        const A = [236, 58], B = [78, 128], Cc = [150, 18];
        // dotted arc
        for (let i = 0; i <= 40; i++) {
          const u = i / 40, x = (1 - u) ** 2 * A[0] + 2 * (1 - u) * u * Cc[0] + u * u * B[0], y = (1 - u) ** 2 * A[1] + 2 * (1 - u) * u * Cc[1] + u * u * B[1];
          if (i % 2 === 0) R(x, y, 1, 1, '#5b6f9c');
        }
        [A, B].forEach(([x, y], i) => { const pr = 3 + Math.sin(t * 3 + i) * 1.2; g.fillStyle = 'rgba(217,119,87,.35)'; g.beginPath(); g.arc(x, y, pr + 3, 0, 7); g.fill(); R(x - 1, y - 1, 3, 3, i ? C.gold : C.clawd); });
        clawd(A[0] + 8, A[1] - 22, 2, { t, hair: HAIR.linfan });
        clawd(B[0] - 32, B[1] - 20, 2, { t, seed: 1, hair: HAIR.yumo });
        // message flies
        const u = ease((t - 1.2) / 4);
        if (t > 1.2) {
          const x = (1 - u) ** 2 * A[0] + 2 * (1 - u) * u * Cc[0] + u * u * B[0], y = (1 - u) ** 2 * A[1] + 2 * (1 - u) * u * Cc[1] + u * u * B[1];
          if (u < 1) { R(x - 5, y - 4, 10, 7, '#f3e9df'); R(x - 3, y + 3, 2, 2, '#f3e9df'); R(x - 3, y - 2, 6, 1, '#b3a296'); R(x - 3, y, 4, 1, '#b3a296'); }
        }
      },
      overlay(t) {
        T('成都', 236, 72, { size: 7, c: '#f3e9df', w: 700 }); T('15:00', 236, 81, { size: 5, c: '#9fb0d6' });
        T('Salaya', 78, 142, { size: 7, c: '#f3e9df', w: 700 }); T('14:00', 78, 151, { size: 5, c: '#9fb0d6' });
        if (t > 5.3) T('今天怎么样', 120, 106, { size: 7, c: '#2a1c16', bg: '#f3e9df', a: (t - 5.3) * 2, w: 700 });
      },
    },
    {
      name: '琴房', place: 'Salaya · 练习室', dur: 11,
      say: '舞还是记不住动作？没事，你弹琴也不是一天就记住的。多跳几遍，身体会记得。',
      sub: '舞还是记不住动作？没事，你弹琴也不是一天就记住的。多跳几遍，身体会记得。',
      draw(t) {
        R(0, 0, 320, 132, '#36415c');
        R(0, 132, 320, 48, '#8a6a4a'); for (let i = 0; i < 8; i++) R(0, 138 + i * 6, 320, 1, '#7a5c3f');
        // mirror
        R(206, 22, 96, 92, '#9fb7c9'); R(206, 22, 96, 3, '#6f8599'); R(214, 34, 3, 30, '#d5e4ee'); R(222, 34, 2, 18, '#d5e4ee');
        R(204, 20, 100, 2, '#262c3d'); R(204, 114, 100, 2, '#262c3d');
        // piano
        R(24, 76, 84, 58, '#1b1a1f'); R(24, 76, 84, 4, '#34323b'); R(28, 100, 76, 6, '#f2efe8');
        for (let i = 0; i < 12; i++) if (i % 7 !== 2 && i % 7 !== 6) R(33 + i * 6, 100, 3, 3, '#1b1a1f');
        R(58, 84, 20, 12, '#e9e1cf');
        if (t < 5) {
          clawd(50, 116 + (Math.floor(t * 4) % 2), 3, { t, hair: HAIR.yumo, legs: false });
        } else {
          const k = t - 5, fall = k > 3.2 && k < 4.4;
          const x = 150 + Math.sin(k * 2.4) * 26, hop = fall ? 0 : Math.abs(Math.sin(k * 4.8)) * 8;
          if (fall) { g.save(); g.translate(x + 18, 150); g.rotate(-0.3); clawd(-18, -24, 3, { t, hair: HAIR.yumo }); g.restore(); }
          else clawd(x, 126 - hop, 3, { t, hair: HAIR.yumo, walk: true });
          if (!fall) clawd(242 - Math.sin(k * 2.4) * 16, 84 - hop / 2, 2, { t, hair: HAIR.yumo, walk: true }); // in the mirror
        }
      },
      overlay(t) {
        if (t < 5) for (let i = 0; i < 3; i++) { const p = (t * 0.5 + i / 3) % 1; T(i % 2 ? '♪' : '♫', 60 + i * 14 + Math.sin(p * 5) * 4, 72 - p * 40, { size: 9, c: C.gold, a: 1 - p }); }
        const k = t - 5;
        if (k > 3.2 && k < 5.2) T('？？', 150 + Math.sin(k * 2.4) * 26 + 22, 108, { size: 9, c: '#fff', w: 700, a: 1 });
        if (t > 5) T('五、六、七、八', 60, 30, { size: 6, c: '#c7d0e6', a: Math.min(1, (t - 5) * 2) });
      },
    },
    {
      name: '两个儿子', place: '宿舍 · 奇奇和六六', dur: 10,
      say: '奇奇又在跟你傲娇了吧。六六倒是勤快，一晚上都在跑轮子。',
      sub: '奇奇又在跟你傲娇了吧。六六倒是勤快，一晚上都在跑轮子 ^^',
      draw(t) {
        R(0, 0, 320, 128, '#e7cfa8'); R(0, 128, 320, 52, '#b98b5e');
        for (let i = 0; i < 20; i++) R(i * 16, 128, 1, 52, '#a97c52');
        R(24, 20, 70, 52, '#9cc3d8'); R(24, 20, 70, 3, '#7a5a3a'); R(24, 69, 70, 3, '#7a5a3a'); R(58, 20, 2, 52, '#7a5a3a');
        g.fillStyle = '#c96f5a'; g.beginPath(); g.ellipse(120, 156, 90, 16, 0, 0, 7); g.fill();
        // 奇奇: golden british shorthair, big round face
        const away = (t % 4) > 2.2; const cx = 100, cy = 108;
        R(cx - 4, cy + 20, 40, 22, '#d8b779'); R(cx - 4, cy + 38, 40, 4, '#c19d5f');
        const sw = Math.round(Math.sin(t * 3) * 3); R(cx + 34, cy + 24 + sw, 12, 4, '#c19d5f');
        R(cx - 10, cy - 6, 52, 32, '#e2c286'); R(cx - 12, cy - 2, 56, 24, '#e2c286');
        R(cx - 8, cy - 12, 8, 8, '#e2c286'); R(cx + 32, cy - 12, 8, 8, '#e2c286'); R(cx - 6, cy - 10, 4, 4, '#e7a9a0'); R(cx + 34, cy - 10, 4, 4, '#e7a9a0');
        if (!away) {
          [[cx + 2, cy + 4], [cx + 24, cy + 4]].forEach(([ex, ey]) => { R(ex, ey, 7, 9, '#2a2320'); R(ex + 1, ey + 1, 2, 2, '#fff'); });
          R(cx + 15, cy + 15, 3, 2, '#c9776c'); R(cx - 4, cy + 14, 5, 2, '#eab2a2'); R(cx + 32, cy + 14, 5, 2, '#eab2a2');
        } else {
          R(cx - 6, cy + 2, 44, 3, '#caa56a'); R(cx - 4, cy + 10, 40, 2, '#caa56a');
        }
        // 六六 in the wheel
        const wx = 236, wy = 118, r = 26;
        R(wx - 2, wy, 4, 40, '#7d8a96'); R(wx - 14, wy + 38, 28, 3, '#7d8a96');
        g.strokeStyle = '#9aa7b3'; g.lineWidth = 2; g.beginPath(); g.arc(wx, wy, r, 0, 7); g.stroke();
        g.lineWidth = 1; for (let i = 0; i < 8; i++) { const a = t * 5 + i * Math.PI / 4; g.beginPath(); g.moveTo(wx, wy); g.lineTo(wx + Math.cos(a) * r, wy + Math.sin(a) * r); g.stroke(); }
        const b = Math.floor(t * 10) % 2;
        g.fillStyle = '#E89A4A'; g.beginPath(); g.ellipse(wx, wy + 16 - b, 12, 8, 0, 0, 7); g.fill();
        R(wx - 5, wy + 18 - b, 10, 4, '#fbe3c4'); R(wx - 10, wy + 12 - b, 2, 2, '#1b1310'); R(wx - 13, wy + 14 - b, 2, 1, '#e99d9d');
        R(wx - 7, wy + 8 - b, 3, 3, '#f0b070'); R(wx + 4, wy + 8 - b, 3, 3, '#f0b070');
      },
      overlay(t) {
        T('奇奇', 120, 88, { size: 6, c: '#5a3a22', bg: 'rgba(255,248,235,.85)', w: 700 });
        T('六六', 236, 82, { size: 6, c: '#5a3a22', bg: 'rgba(255,248,235,.85)', w: 700 });
        if ((t % 4) > 2.2) T('哼', 150, 96, { size: 8, c: '#7a4a38', w: 700, a: ((t % 4) - 2.2) * 3 });
      },
    },
    {

  // ---------- player state ----------
  let i = 0, st = 1.6, playing = false, ended = false, spoken = false;
  let speaking = false, speakDeadline = 0, clock = 0;
  let voiceOn = true, musicOn = true;
  const subEl = document.getElementById('sub');
  const cover = document.getElementById('cover');
  const playBtn = document.getElementById('playBtn');
  const chaptersEl = document.getElementById('chapters');

  scenes.forEach((sc, n) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = `<small>${String(n + 1).padStart(2, '0')}</small>${sc.name}`;
    b.addEventListener('click', () => { goto(n); if (!playing) play(); });
    li.appendChild(b); chaptersEl.appendChild(li);
  });
  const chapBtns = [...chaptersEl.querySelectorAll('button')];
  function markChapters() { chapBtns.forEach((b, n) => { b.classList.toggle('on', n === i); b.classList.toggle('done', n < i); }); }

  function setSub(txt) { subEl.innerHTML = txt ? `<b>林帆</b>${txt}` : ''; }

  // ---------- voice ----------
  const synth = window.speechSynthesis;
  let zhVoice = null;
  function pickVoice() {
    if (!synth) return;
    const vs = synth.getVoices().filter(v => /^zh/i.test(v.lang));
    const pref = ['Xiaoxiao', 'Tingting', 'Ting-Ting', 'Huihui', 'Yaoyao', 'Female', '女'];
    zhVoice = vs.find(v => /zh[-_]CN/i.test(v.lang) && pref.some(p => v.name.includes(p))) || vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs[0] || null;
  }
  if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }

  function speak(text) {
    if (!voiceOn || !synth) return;
    try {
      synth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN'; if (zhVoice) u.voice = zhVoice;
      u.rate = 0.92; u.pitch = 1.05;
      u.onend = u.onerror = () => { speaking = false; duck(false); };
      speaking = true; speakDeadline = clock + text.length * 0.3 + 2.5;
      duck(true);
      synth.speak(u);
    } catch (e) { speaking = false; }
  }
  function stopVoice() { speaking = false; try { synth && synth.cancel(); } catch (e) {} duck(false); }

  // ---------- music: soft lo-fi, synthesized live ----------
  let ac = null, master, musicBus, nextStep = 0, stepIdx = 0;
  const BPM = 74, STEP = 60 / BPM / 4;
  const CHORDS = [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59], [46, 50, 53, 57], [45, 48, 52, 55], [50, 53, 57, 60], [43, 47, 50, 53]];
  const BASS = [41, 40, 38, 36, 34, 33, 38, 31];
  const MEL = [[0, 2], [3, 3], [6, 1], [8, 2], [11, 3], [14, 1]];
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  function initAudio() {
    if (ac) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
    musicBus = ac.createGain(); musicBus.gain.value = musicOn ? 0.5 : 0;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
    musicBus.connect(lp); lp.connect(master);
    // vinyl crackle
    const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let k = 0; k < len; k++) d[k] = (Math.random() * 2 - 1) * 0.02 + (Math.random() < 0.0006 ? (Math.random() - 0.5) * 0.9 : 0);
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3000; bp.Q.value = 0.6;
    const cg = ac.createGain(); cg.gain.value = 0.25;
    src.connect(bp); bp.connect(cg); cg.connect(musicBus); src.start();
    nextStep = ac.currentTime + 0.1;
  }
  function tone(freq, time, dur, type, vol, attack = 0.01) {
    const o = ac.createOscillator(), gn = ac.createGain();
    o.type = type; o.frequency.value = freq;
    gn.gain.setValueAtTime(0, time);
    gn.gain.linearRampToValueAtTime(vol, time + attack);
    gn.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    o.connect(gn); gn.connect(musicBus); o.start(time); o.stop(time + dur + 0.05);
    return o;
  }
  function kick(time) {
    const o = ac.createOscillator(), gn = ac.createGain();
    o.frequency.setValueAtTime(110, time); o.frequency.exponentialRampToValueAtTime(45, time + 0.18);
    gn.gain.setValueAtTime(0.45, time); gn.gain.exponentialRampToValueAtTime(0.0001, time + 0.3);
    o.connect(gn); gn.connect(musicBus); o.start(time); o.stop(time + 0.35);
  }
  function hat(time, vol) {
    const len = ac.sampleRate * 0.05, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let k = 0; k < len; k++) d[k] = (Math.random() * 2 - 1) * (1 - k / len);
    const s = ac.createBufferSource(), hp = ac.createBiquadFilter(), gn = ac.createGain();
    s.buffer = buf; hp.type = 'highpass'; hp.frequency.value = 7000; gn.gain.value = vol;
    s.connect(hp); hp.connect(gn); gn.connect(musicBus); s.start(time);
  }
  function schedule() {
    if (!ac || !playing) return;
    while (nextStep < ac.currentTime + 0.2) {
      const bar = Math.floor(stepIdx / 16) % CHORDS.length, s = stepIdx % 16, ch = CHORDS[bar];
      const swing = s % 2 ? STEP * 0.12 : 0, tt = nextStep + swing;
      if (s === 0) {
        ch.forEach((m, n) => { tone(hz(m), tt + n * 0.012, STEP * 16, 'triangle', 0.045, 0.25); tone(hz(m) * 1.004, tt, STEP * 16, 'sine', 0.03, 0.3); });
        tone(hz(BASS[bar]), tt, STEP * 7, 'sine', 0.2, 0.02);
      }
      if (s === 8) tone(hz(BASS[bar] + 7), tt, STEP * 6, 'sine', 0.14, 0.02);
      const mel = MEL.find(([p]) => p === s);
      if (mel && (stepIdx / 16 + s) % 5 !== 3) { const m = ch[mel[1]] + 12; tone(hz(m), tt, 0.9, 'sine', 0.07); tone(hz(m) * 2, tt, 0.35, 'sine', 0.015); }
      if (s === 0 || s === 10) kick(tt);
      if (s % 4 === 2) hat(tt, 0.05);
      if (s === 4 || s === 12) hat(tt, 0.09);
      nextStep += STEP; stepIdx++;
    }
  }
  function duck(on) {
    if (!ac || !musicOn) return;
    musicBus.gain.cancelScheduledValues(ac.currentTime);
    musicBus.gain.setTargetAtTime(on ? 0.28 : 0.5, ac.currentTime, 0.25);
  }

  // ---------- transport ----------
  function goto(n) {
    stopVoice();
    i = n; st = 0; spoken = false; ended = false;
    setSub(''); markChapters();
  }
  function play() {
    initAudio();
    if (ac && ac.state === 'suspended') ac.resume();
    if (ended) goto(0);
    if (ac) nextStep = Math.max(nextStep, ac.currentTime + 0.05);
    playing = true; cover.hidden = true; playBtn.textContent = '暂停';
    if (st > 1.5 && i === 0 && !spoken) st = 0;
    try { synth && synth.paused && synth.resume(); } catch (e) {}
  }
  function pause() {
    playing = false; playBtn.textContent = '继续';
    try { synth && synth.pause(); } catch (e) {}
    if (ac) ac.suspend();
  }
  cover.addEventListener('click', play);
  playBtn.addEventListener('click', () => playing ? pause() : play());
  document.getElementById('restartBtn').addEventListener('click', () => { goto(0); play(); });
  const voiceBtn = document.getElementById('voiceBtn');
  voiceBtn.addEventListener('click', () => { voiceOn = !voiceOn; voiceBtn.setAttribute('aria-pressed', voiceOn); if (!voiceOn) stopVoice(); });
  const musicBtn = document.getElementById('musicBtn');
  musicBtn.addEventListener('click', () => {
    musicOn = !musicOn; musicBtn.setAttribute('aria-pressed', musicOn);
    if (ac) musicBus.gain.setTargetAtTime(musicOn ? (speaking ? 0.28 : 0.5) : 0, ac.currentTime, 0.2);
  });

  function update(dt) {
    if (!playing) return;
    st += dt;
    const sc = scenes[i];
    if (!spoken && st > 0.7) { spoken = true; setSub(sc.sub); speak(sc.say); }
    if (speaking && clock > speakDeadline) speaking = false;
    if (st >= sc.dur && !speaking) {
      if (i < scenes.length - 1) goto(i + 1);
      else if (st >= sc.dur + 3) { ended = true; playing = false; playBtn.textContent = '再看一遍'; cover.hidden = false; cover.querySelector('em').textContent = '再看一遍'; }
    }
  }

  function render() {
    const sc = scenes[i];
    const t = ended ? sc.dur + 3 : st;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, 320, 180);
    sc.draw.call(sc, t);
    G.imageSmoothingEnabled = false;
    G.drawImage(off, 0, 0, 1280, 720);
    sc.overlay && sc.overlay.call(sc, t);
    // chapter tag
    T(`${String(i + 1).padStart(2, '0')}  ${sc.place}`, 8, 10, { size: 5.5, align: 'left', c: '#fff7ee', bg: 'rgba(20,12,8,.55)', a: Math.min(1, t * 2) });
    // fade between scenes
    const fin = 1 - Math.min(1, t / 0.5);
    if (fin > 0 && !(i === 0 && !playing)) { G.fillStyle = `rgba(0,0,0,${fin})`; G.fillRect(0, 0, 1280, 720); }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (playing) clock += dt;
    update(dt); schedule(); render();
    requestAnimationFrame(frame);
  }
  markChapters();
  requestAnimationFrame(frame);
  if (document.fonts) document.fonts.ready.then(render);
})();
